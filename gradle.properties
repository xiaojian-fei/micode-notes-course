org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=false
android.nonTransitiveRClass=false
android.builder.sdkDownload=true
# 工程路径包含中文（D:\软件工程作业\Notes-master），AGP 默认会因此直接报错终止，
# 这里按 AGP 官方提示关闭该校验（其余环节均按 UTF-8 处理路径）。
android.overridePathCheck=true
# AGP 8 默认 nonFinalResIds=true，R.id.* 不再是编译期常量，原工程中
# NotesListActivity / NoteEditActivity 里的 switch(R.id.xxx) 会报
# “需要常量表达式”，这里恢复为 final 资源 ID。
android.nonFinalResIds=false
